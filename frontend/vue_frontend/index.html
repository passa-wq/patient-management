<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Patient Management</title>
</head>
<body>
    <h1>Patient Management</h1>
    <h2>All Patients</h2>
    <ul id="patient-list"></ul>

    <h2>Add Patient</h2>
    <form id="add-patient-form">
        <input type="text" id="vorname" placeholder="Vorname" required />
        <input type="text" id="nachname" placeholder="Nachname" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="text" id="telefon" placeholder="Telefon" />
        <input type="date" id="geburtsdatum" placeholder="Geburtsdatum" />
        <textarea id="krankengeschichte" placeholder="Krankengeschichte"></textarea>
        <button type="submit">Add</button>
    </form>

    <script>
        const apiUrl = 'http://127.0.0.1:8000/patients';

        // Funktion zum Laden der Patienten
        function loadPatients() {
            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('patient-list');
                    list.innerHTML = '';
                    if (data.length === 0) {
                        list.innerHTML = '<li>Keine Patienten vorhanden</li>';
                    } else {
                        data.forEach(p => {
                            const li = document.createElement('li');
                            li.textContent = `${p.vorname} ${p.nachname} - ${p.email}`;
                            list.appendChild(li);
                        });
                    }
                })
                .catch(err => console.error(err));
        }

        // Event: Patient hinzufügen
        document.getElementById('add-patient-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const patient = {
                vorname: document.getElementById('vorname').value,
                nachname: document.getElementById('nachname').value,
                email: document.getElementById('email').value,
                telefon: document.getElementById('telefon').value,
                geburtsdatum: document.getElementById('geburtsdatum').value,
                krankengeschichte: document.getElementById('krankengeschichte').value
            };

            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(patient)
            })
            .then(res => res.json())
            .then(() => {
                alert('Patient hinzugefügt!');
                document.getElementById('add-patient-form').reset();
                loadPatients(); // Patientenliste aktualisieren
            })
            .catch(err => alert('Fehler: ' + err));
        });

        // Beim Laden der Seite Patienten anzeigen
        window.onload = loadPatients;
    </script>
</body>
</html>
